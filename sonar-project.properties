sonar.projectKey=gdec-tokens-backend

# Analyse the application source only.
#
# With no sonar.sources the scanner walks the whole repository — 1.62 MB, of
# which the lockfile alone is 478 KB and docs/ another ~150 KB. Scoping to src
# roughly halves the report.
#
# Note the 413 on api/ce/submit is a server-side limit: nginx defaults
# client_max_body_size to 1 MB, and nothing in this file can raise it. Trimming
# the payload is worth doing on its own merits, but if analysis still fails the
# proxy in front of SonarQube needs `client_max_body_size 50M;`.
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Report the Jest specs as tests rather than as untested source, and feed the
# coverage in so the dashboard reflects the 38 tests that exist.
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/docs/**,\
  **/scripts/**,\
  **/test/**,\
  **/migrations/**,\
  **/*.json,\
  **/*.xlsx,\
  **/*.p8,\
  **/*.pem

# Wiring, generated code and declarations — excluded from the coverage figure so
# it describes logic, matching how jest is configured in package.json.
sonar.coverage.exclusions=\
  **/*.module.ts,\
  **/main.ts,\
  **/migrations/**,\
  **/entities/**,\
  **/dto/**
