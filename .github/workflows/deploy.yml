name: Deploy to EC2

on:
  push:
    branches:
      - staging
      - master

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    # Staging only. This workflow also fires on master, and there's no value in
    # re-analysing the same commit on its way to production — the code was
    # already scanned when it landed on staging.
    if: github.ref == 'refs/heads/staging'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: sonarsource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      # If you wish to fail your job when the Quality Gate is red, uncomment the
      # following lines. This would typically be used to fail a deployment.
      # - uses: sonarsource/sonarqube-quality-gate-action@v1
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'

    steps:
      - name: Deploy via SSH (staging)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ${{ secrets.STAGING_EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            APP_DIR="$HOME/gdec-tokens-backend"

            echo "==> Pulling latest code (staging)..."
            cd "$APP_DIR"
            git fetch origin
            git reset --hard origin/staging

            echo "==> Installing dependencies..."
            npm ci

            echo "==> Building..."
            npm run build

            echo "==> Running migrations..."
            npm run migration:run:prod

            echo "==> Reloading app (zero-downtime)..."
            pm2 startOrReload ecosystem.config.js --only gdec-tokens-backend-staging --update-env

            echo "==> Staging deploy done."

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Deploy via SSH (production)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            APP_DIR="$HOME/gdec-tokens-backend"

            echo "==> Pulling latest code (production)..."
            cd "$APP_DIR"
            git fetch origin
            git reset --hard origin/master

            echo "==> Installing dependencies..."
            npm ci

            echo "==> Building..."
            npm run build

            echo "==> Running migrations..."
            npm run migration:run:prod

            echo "==> Reloading app (zero-downtime)..."
            pm2 startOrReload ecosystem.config.js --only gdec-tokens-backend --update-env

            echo "==> Production deploy done."
